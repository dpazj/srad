[package]
name = "srad"
version = "0.6.0"
description = "Sparkplug development framework"
readme = "../README.md"
keywords = ["sparkplug", "sparkplug-b", "mqtt", "iot", "async"]
categories = ["embedded", "network-programming", "asynchronous"]
edition.workspace = true 
homepage.workspace = true 
repository.workspace = true
license.workspace = true 
authors.workspace = true
rust-version.workspace = true

[features]
default = ["eon", "app"]
eon = []
app = []

[dependencies]
srad-eon = { path = "../srad-eon", version = "0.6.0" }
srad-app = { path = "../srad-app", version = "0.4.0" }
srad-client = { path = "../srad-client", version = "0.4.0" }
srad-types = { path = "../srad-types", version = "0.4.0" }
srad-macros = { path = "../srad-macros", version = "0.4.0" }

[dev-dependencies]
tokio = { workspace = true }
srad-client-rumqtt = { path = "../srad-client-rumqtt", version = "0.4.0" }
